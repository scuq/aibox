# Storage for podman inside the aibox container. graphroot and runroot are
# required keys but apply to root only; the aibox user stores under
# ~/.local/share/containers, which is a volume in a nested podman session.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev"
