# Defaults for podman inside the aibox container. It only runs in a session
# with nested podman enabled ('aibox podman enable'); see the Containerfile.

[containers]
# Inner containers join the outer container's namespaces. The network is the
# one that matters: the egress proxy and the internal network stay in force.
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"
# No cgroup is delegated in here. The outer cgroup still caps everything.
cgroups = "disabled"
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
